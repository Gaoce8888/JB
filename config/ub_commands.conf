#!/bin/bash
# Ubuntu 命令大全脚本配置文件

# 版本信息
VERSION="2.0"
SCRIPT_NAME="Ubuntu 命令大全 - 项目部署专用"

# 安装路径
INSTALL_DIR="/usr/local/bin/ub_command_menu"
CONFIG_DIR="$HOME/.ub_command_menu"
LOG_DIR="$CONFIG_DIR/logs"
PRESET_FILE="$CONFIG_DIR/presets.conf"
CUSTOM_CMD_FILE="$CONFIG_DIR/custom_commands.json"

# 日志设置
ENABLE_LOGGING=true
LOG_FILE="$LOG_DIR/ub_commands_$(date +%Y%m%d).log"
MAX_LOG_SIZE=10485760  # 10MB
MAX_LOG_FILES=7

# 用户界面设置
ENABLE_COLORS=true
CLEAR_SCREEN_ON_MENU=true
SHOW_COMMAND_PREVIEW=true
CONFIRM_DANGEROUS_COMMANDS=true

# 性能设置
CACHE_ENABLED=true
CACHE_DIR="$CONFIG_DIR/cache"
CACHE_EXPIRY=3600  # 秒

# 默认设置
DEFAULT_EDITOR="nano"
DEFAULT_SHELL="/bin/bash"
DEFAULT_TIMEOUT=30

# 危险命令列表
DANGEROUS_COMMANDS=(
    "rm -rf"
    "dd if="
    "mkfs"
    "fdisk"
    "parted"
    "reboot"
    "shutdown"
    "systemctl stop"
    "kill"
    "pkill"
)

# 自动补全设置
ENABLE_AUTOCOMPLETE=true
HISTORY_FILE="$CONFIG_DIR/command_history"
MAX_HISTORY_ENTRIES=1000